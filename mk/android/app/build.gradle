plugins {
    id 'com.android.application'
}
android {
    namespace 'org.construo.app'
    compileSdk 34
    defaultConfig {
        applicationId "org.construo.app"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "0.2.3-dev"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}
// versionName should be injected from the top-level VERSION file by CI.
